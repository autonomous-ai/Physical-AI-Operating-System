[package]
name = "lamp-expression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
lamp-msgs = { path = "../msgs" }
lamp-bus = { path = "../bus" }
lamp-ipc = { path = "../ipc" }
# The keeper's pause, read as the body reads it (`lamp_body::pause_in`).
lamp-body = { path = "../body" }
base64 = "0.22"
# Local time across daylight saving (#820), pinned as Schedule and Mood pin it.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[lints]
workspace = true
