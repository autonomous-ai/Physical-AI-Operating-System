# V1's site (scripts/imager/build-orangepi.sh on origin/main, "verbatim from
# production OPi") for a V2 lamp in setup: V1's page from its bundle, /api/ to
# lamp-setup on 127.0.0.1:5000, and the phones' sign-in checks answered 204.
# Removed: hal (5001) and openclaw (18789), and V1's shell, exec, openapi,
# buddy and harness routes, none of which a V2 lamp has. lamp-setup starts
# nginx while the lamp is not set up and stops it after (docs/setup.md).
upstream backend  { server 127.0.0.1:5000; }

server {
  listen 80 default_server;
  root /usr/share/nginx/html/setup;
  index index.html;
  client_max_body_size 64k;
  # The account page's link carries the user's voice key in its URL
  # (/setup?llm_api_key=…), which an access log would keep where no reset
  # wipes it (the reviewer on #1120).
  access_log off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss: http:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

  # V1's cache rules: the fingerprinted assets forever, index.html never.
  location = /index.html { expires -1; }
  location /assets/      { expires 1y; }

  location / { try_files $uri /index.html; }

  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /generate_204       { return 204; }
  location = /hotspot-detect.html { return 204; }
  location = /ncsi.txt            { return 204; }
  location = /connecttest.txt     { return 204; }
}
