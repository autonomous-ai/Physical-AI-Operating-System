# The real case's recording (a face for 3 hours without leaving): the demo acts once, at about a minute, and never again while they stay, cooldown or not (it re-arms only when they leave).
[[expect]]
at = "1m"
within = "1m"
call = "body.gaze"
args = { look_at = "face" }

[[expect]]
call = "body.gesture"
args = { gesture = "stretching" }
