[package]
name = "lamp-gemini"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "=0.22.1"
# Tungstenite traces raw serialized authentication headers. Compile those
# dependency debug/trace sites out even when the application enables logging.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Paused runtime clock: minutes of scripted conversation without the wait.
tokio = { version = "=1.53.1", features = ["test-util"] }

# The probe scores what it observed. Those rules have tests of their own, so
# the example is built and run with the rest.
[[example]]
name = "service_probe"
test = true

[lints]
workspace = true
