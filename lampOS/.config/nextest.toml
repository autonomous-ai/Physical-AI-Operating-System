# cargo-nextest configuration for the lampOS workspace.
#
# The realtime group: tests that wait on the real clock (real-speed fake
# playback, sleeps, deadlines and report periods measured in seconds). On the
# 2026-10-15 ARM64 runs (38715042828, 38715014248) these 123 tests took 977 s
# of the 1,191 s spent on all 4,507 tests. Until each has an injectable clock
# or a shorter fixture, pull requests skip them (profile `pr`); every push to
# lamp-voice runs every test (profile `default`). Run them alone with profile
# `realtime`. The group also holds tests whose real-clock bound a loaded
# runner misses (they failed under one-test-per-core pull request runs).
# See docs/realtime-tests.md.
#
# The same filterset appears three times below (the group override, `pr`'s
# exclusion and `realtime`'s selection). Keep all three identical.

[test-groups]
# One at a time: these tests measure real time and must not compete.
realtime = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
    (binary_id(lamp-memory::health) & test(=the_environment_alone_does_not_enable_reporting_or_create_bus_data))
  | binary_id(lamp-voice::capture_hold_worker)
  | (binary_id(lamp-voice) & test(=coordinator::tests::endpoint_session::endpoint_fixture_reaps_on_panic_before_and_after_handoff))
  | (binary_id(lamp-health::program) & test(=between_two_healths_five_seconds_apart_the_program_is_not_taken_for_gone))
'''
test-group = 'realtime'
# EXPERIMENT (#823): start the group's one-at-a-time chain first, so it runs
# beside the rest instead of after it.
priority = 100

# EXPERIMENT (#823, do not merge): pull requests run every test, the
# realtime group too, still one at a time through its test group, to see
# whether its real-time bounds hold beside a full core load.
[profile.pr]
default-filter = 'all()'

# By hand: only the realtime group, e.g.
#   cargo nextest run --release --workspace --profile realtime -j 1
[profile.realtime]
default-filter = '''
    (binary_id(lamp-memory::health) & test(=the_environment_alone_does_not_enable_reporting_or_create_bus_data))
  | binary_id(lamp-voice::capture_hold_worker)
  | (binary_id(lamp-voice) & test(=coordinator::tests::endpoint_session::endpoint_fixture_reaps_on_panic_before_and_after_handoff))
  | (binary_id(lamp-health::program) & test(=between_two_healths_five_seconds_apart_the_program_is_not_taken_for_gone))
'''
