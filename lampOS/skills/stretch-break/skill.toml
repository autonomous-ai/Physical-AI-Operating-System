# Stretch break: one quiet, wordless invitation to get up after a long sitting
# (lampOS/docs/creature.md: "once in a while, a stretch of its own, as an
# invitation, never a lecture"). Fields marked proposed are the lamp skill
# creator's, until the runtime (#938) takes or renames them.
needs = ["eyes", "body", "light"]

[trigger]
topic = "humans/faces/tracked"
when = "present"          # a face there, continuously
for = "50m"
gap = "2m"                # proposed: looking away or leaning out of view does not end the sitting
rearm = "leaves"          # proposed: once per sitting; again only after they have left
cooldown = "90m"

[[while]]                 # proposed: not in the middle of a conversation
topic = "voice/state"
equals = "resting"

[ask]
policy = "nudge"

[[do]]
body = { look_at = "face" }

[[do]]
body = { gesture = "stretching" }

[[do]]
light = { colour = "warm", level = 2, for = "4s" }
