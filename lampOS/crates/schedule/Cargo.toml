[package]
name = "lamp-schedule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lamp-ipc = { path = "../ipc" }
serde.workspace = true
serde_json.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rustix = { version = "1", features = ["fs", "process", "time", "net", "event"] }
getrandom = "0.4"
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "schedule_check"
test = true

[lints]
workspace = true
