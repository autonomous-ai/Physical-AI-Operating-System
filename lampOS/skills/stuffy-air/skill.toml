# Stuffy air (lampOS/docs/creature.md: "first its posture droops a little and
# its eye dims a shade while it lasts; it says ... only if someone talks to
# it"). Speech is the voice's, never this skill's. Written to lamp-skills'
# schema (docs/skills.md, "The schema, as lamp-skills reads it", #938).
needs = ["air", "eyes", "light"]

[trigger]
topic = "air/state"
field = "co2_ppm"
above = 1200              # the lamp's own line for "stuffy" (air/state's feel)
for = "10m"               # a short rise (someone breathing close to the sensor) does nothing
rearm = "ends"            # once per stuffy spell
cooldown = "1h"

[[while]]                 # only with someone at the desk to see it
topic = "humans/faces/tracked"
present = true

[ask]
policy = "nudge"

[[do]]
# A shade dimmer than the person's light, until the air clears. NOT TO BE
# INSTALLED YET: lamp-skills carries out the dim but not `until` (#938), so
# nothing would give the person's light back; that waits for the third's
# arbitration and leases (#940).
light = { dim = 1, until = "ends" }

# Once move files land (#940): a small droop held while it lasts.
# [[do]]
# body = { move = "moves/droop.toml", until = "ends" }
