[package]
name = "lamp-surround"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
network-manager = ["dep:zbus"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-ipc = { path = "../ipc" }
lamp-gemini = { path = "../gemini" }
tough = { version = "=0.24.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "signal", "sync", "process"] }
futures-util = "0.3"
url = "2"
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4"
zeroize = "=1.9.1"
jiff = { version = "0.2", features = ["serde"] }
subtle = "2"
zbus = { version = "=5.19.0", optional = true }

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
