# Simulated Lamp audio: the kernel loopback card only (no host audio device).
# Runtime speaker plays into Loopback 0,0; the room model captures it from 1,0.
# The room model plays the microphone mix into 0,1; the runtime captures 1,1.
pcm.device_speaker { type hw; card Loopback; device 0; subdevice 0 }
pcm.device_micro2 { type hw; card Loopback; device 1; subdevice 1 }
pcm.room_speaker_in { type hw; card Loopback; device 1; subdevice 0 }
pcm.room_mic_out { type hw; card Loopback; device 0; subdevice 1 }
