  | (binary_id(lamp-voice) & test(=provider_worker::tests::kept_start::with_no_first_answer_the_patience_ends_in_the_strict_timeout_and_no_end))
  | (binary_id(lamp-voice) & test(=provider_worker::tests::resumed_question_survives_a_silent_service_and_the_assumption_is_reported))
