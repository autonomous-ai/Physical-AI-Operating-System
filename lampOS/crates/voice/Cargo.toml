[package]
name = "lamp-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rtrb.workspace = true
sha2.workspace = true
hound.workspace = true
lamp-turn-owner = { path = "../turn-owner" }
lamp-ipc = { path = "../ipc" }
lamp-audio = { path = "../audio" }
lamp-camera = { path = "../camera" }
lamp-ring = { path = "../ring" }
lamp-body = { path = "../body" }
lamp-gemini = { path = "../gemini" }
lamp-turn-end-wire = { path = "../turn-end-wire" }
lamp-bus = { path = "../bus" }
lamp-msgs = { path = "../msgs" }
lamp-controls = { path = "../controls" }
lamp-schedule = { path = "../schedule" }
tokio = { version = "=1.53.1", features = ["rt", "time", "macros"] }
rustix = { version = "=1.1.5", features = ["fs", "process", "net"] }
sonora-agc2 = "=0.2.0"
sonora-simd = "=0.2.0"
signal-hook = { version = "=0.4.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "=0.8.0"
thread-priority = "=3.1.1"

[lints]
workspace = true

[dev-dependencies]
lamp-actions = { path = "../actions" }
# The reader of what `expression_out` says: tested against, never linked.
lamp-expression = { path = "../expression" }
